[supervisord]
nodaemon=true
user=root

[program:webapp]
# Используем $PORT, который RelaxDev передает в контейнер (всегда 8080)
command=uvicorn webapp:app --host 0.0.0.0 --port 8080
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=python bot.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
